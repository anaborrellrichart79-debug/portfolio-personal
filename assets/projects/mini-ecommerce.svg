    <rect x="228" y="18" width="144" height="86" rx="10" fill="#273549"/>
    <rect x="228" y="120" width="100" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="228" y="144" width="60" height="14" rx="7" fill="#22c55e"/>

    <rect x="420" width="180" height="180" rx="14" fill="#1e293b" stroke="#334155"/>
    <rect x="438" y="18" width="144" height="86" rx="10" fill="#273549"/>
    <rect x="438" y="120" width="100" height="12" rx="6" fill="#cbd5e1"/>
