<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mini e-commerce">
  <defs>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="ec-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#334155" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#ec-bg)"/>
  <rect width="1200" height="600" fill="url(#ec-grid)"/>
  <circle cx="150" cy="520" r="230" fill="#22c55e" opacity=".10"/>

  <g transform="translate(80 96)">
    <rect width="150" height="34" rx="17" fill="#22c55e" opacity=".18"/>
    <text x="75" y="23" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#86efac" text-anchor="middle">FRONTEND</text>
  </g>

  <text x="80" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="76" font-weight="700" fill="#f8fafc">Mini e-commerce</text>
  <text x="80" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Catálogo, carrito y checkout en JavaScript puro</text>

  <g transform="translate(80 340)">
    <rect width="180" height="180" rx="14" fill="#1e293b" stroke="#334155"/>
    <rect x="18" y="18" width="144" height="86" rx="10" fill="#273549"/>
    <rect x="18" y="120" width="100" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="18" y="144" width="60" height="14" rx="7" fill="#22c55e"/>

